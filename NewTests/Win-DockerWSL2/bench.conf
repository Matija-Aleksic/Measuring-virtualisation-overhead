# =============================================================================
# bench.conf  —  Win-DockerWSL2 (Docker Desktop, WSL2 backend, Windows Server 2025)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
#
# Run this INSIDE a container (matches the Linux-Docker setup pattern):
#   docker run -it --cpuset-cpus=0-3 --cpus=4 --memory=16g --memory-swap=16g \
#     --pids-limit=4096 debian:trixie
# then pull benchmark.sh/this bench.conf into the container same as any guest.

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="Docker-WSL2"
HOST_OS="Windows Server 2025"
ISOLATION_TYPE="Container"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
IO_DIR="${HOME}"
DISK_TYPE="overlay2 (on WSL2-VHD)"   # container's writable layer sits on top of the WSL2 VM's own virtual disk
PROVISIONING_TYPE="dynamic"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
