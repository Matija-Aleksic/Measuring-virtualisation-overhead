# =============================================================================
# bench.conf  —  Win-WSL2 (native WSL2, no Docker, on Windows Server 2025)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
#
# ISOLATION_TYPE is deliberately "None" — see TEST_METHODOLOGY.md's
# "Remaining honest limitations" (2026-07-21 decision). Windows has no literal
# bare-metal option for this bash suite, so this run stands in as the
# Windows-host baseline that compile_results.py compares every other
# Windows-host platform (Docker-WSL2, Hyper-V, VMware, VirtualBox) against.
# This means every Windows-host overhead_pct is relative to WSL2, not to bare
# silicon — WSL2 itself already runs on a lightweight Hyper-V VM underneath.

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="WSL2"
HOST_OS="Windows Server 2025"
ISOLATION_TYPE="None"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
IO_DIR="${HOME}"
DISK_TYPE="WSL2-VHD"
PROVISIONING_TYPE="dynamic"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
