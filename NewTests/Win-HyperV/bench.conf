# =============================================================================
# bench.conf  —  Win-HyperV (Hyper-V VM, Windows Server 2025)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
# Guest: Debian 13 (trixie) Gen2 VM, 4 vCPU, 16GB, dynamic VHDX — same specs
# used for the VMware/VirtualBox guests, for cross-hypervisor comparability.

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="Hyper-V"
HOST_OS="Windows Server 2025"
ISOLATION_TYPE="VM"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
IO_DIR="${HOME}"
DISK_TYPE="VHDX"
PROVISIONING_TYPE="dynamic"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
