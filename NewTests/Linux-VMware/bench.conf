# =============================================================================
# bench.conf  —  Linux-VMware (VMware Workstation VM, Ubuntu 24.04 LTS host)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
# Guest: Debian 13 (trixie) genericcloud, 4 vCPU, 16GB, VMDK disk. Guest OS
# matches the QEMU/VirtualBox/Hyper-V guests (all Debian 13) so the guest
# distro is not a confound across hypervisors/hosts. HOST_OS below stays the
# PHYSICAL host (Ubuntu 24.04). Same Debian 13 cloud image as the other Linux
# VMs, a FRESH copy converted to VMDK (no state inherited).

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="VMware"
HOST_OS="Ubuntu 24.04 LTS"
ISOLATION_TYPE="VM"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
# VM virtual disk (VMDK with SCSI controller)
IO_DIR="${HOME}"
DISK_TYPE="pvscsi"
PROVISIONING_TYPE="vmdk-thin"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
