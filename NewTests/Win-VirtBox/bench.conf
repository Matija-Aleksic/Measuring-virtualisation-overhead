# =============================================================================
# bench.conf  —  Win-VirtBox (VirtualBox on Windows Server 2025)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="VirtualBox"
HOST_OS="Windows Server 2025"
ISOLATION_TYPE="VM"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
# Same always-on iperf3 peer used for every platform (the networkstatic/iperf3
# docker container, published on both tcp AND udp/5201 after the earlier fix).
# NOT this VM's own address — that's 10.0.2.15 (VirtualBox NAT-internal), only
# relevant for reaching the guest itself, irrelevant to what it tests against.
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
IO_DIR="${HOME}"
DISK_TYPE="SATA-AHCI"       # VirtualBox has no pvscsi equivalent; native AHCI controller
PROVISIONING_TYPE="dynamic" # VBox's thin-provisioning equivalent (createmedium --variant Standard)

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
