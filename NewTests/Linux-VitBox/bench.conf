# =============================================================================
# bench.conf  —  Linux-VitBox (VirtualBox VM, Ubuntu 24.04 LTS host)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
# Guest: Ubuntu 24.04 LTS minimal, 4 vCPU, 16GB, VDI disk (same specs
# as QEMU/VMware guests for cross-hypervisor comparability).

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="VirtualBox"
HOST_OS="Ubuntu 24.04 LTS"
ISOLATION_TYPE="VM"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
# VM virtual disk (VDI)
IO_DIR="${HOME}"
DISK_TYPE="SATA-AHCI"
PROVISIONING_TYPE="vdi-dynamic"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
