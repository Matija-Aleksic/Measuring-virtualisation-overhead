# =============================================================================
# bench.conf  —  Linux-BareMetal (Ubuntu 24.04 LTS, bare metal)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
# Baseline: native Linux on physical hardware. No isolation overhead.
# All tests run directly on the host kernel and filesystem.

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="Bare_Metal"
HOST_OS="Ubuntu 24.04 LTS"
ISOLATION_TYPE="None"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
IO_DIR="${HOME}"
DISK_TYPE=""
PROVISIONING_TYPE=""

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
