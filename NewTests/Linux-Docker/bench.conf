# =============================================================================
# bench.conf  —  Linux-Docker (Docker containers, Ubuntu 24.04 LTS host)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
# Container: OS-level isolation via Docker (namespaces + cgroups).
# Run this INSIDE the container after: docker run -it --cpuset-cpus=0-3 \
#   --cpus=4 --memory=16g --memory-swap=16g --pids-limit=4096 \
#   ubuntu:24.04 bash
# then copy benchmark.sh and this bench.conf into the container.

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="Docker"
HOST_OS="Ubuntu 24.04 LTS"
ISOLATION_TYPE="Container"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
# Writable layer = overlay2 on the host's filesystem (passed through from docker daemon)
IO_DIR="${HOME}"
DISK_TYPE="overlayfs"
PROVISIONING_TYPE="overlay2"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
