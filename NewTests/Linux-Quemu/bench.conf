# =============================================================================
# bench.conf  —  Linux-Quemu (QEMU/KVM VM, Ubuntu 24.04 LTS host)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
# Guest: Debian 13 (trixie) genericcloud, 4 vCPU, 16GB, qcow2 disk. Guest OS
# matches the VMware/VirtualBox/Hyper-V guests (all Debian 13) so the guest
# distro is not a confound when comparing VM overhead across hypervisors and
# across hosts. HOST_OS below stays the PHYSICAL host (Ubuntu 24.04), same
# convention the Windows-round VMs used (HOST_OS=Windows, guest=Debian 13).

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="QEMU-KVM"
HOST_OS="Ubuntu 24.04 LTS"
ISOLATION_TYPE="VM"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
# VM virtual disk (qcow2)
IO_DIR="${HOME}"
DISK_TYPE="virtio-blk"
PROVISIONING_TYPE="qcow2-dynamic"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
