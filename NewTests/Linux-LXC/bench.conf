# =============================================================================
# bench.conf  —  Linux-LXC (LXC containers, Ubuntu 24.04 LTS host)
# =============================================================================
# Generated from bench.conf.example. See that file for full field docs.
# Container: OS-level isolation via LXC (namespaces + cgroups).
# Run this INSIDE the LXC container (started with lxc-create / lxc-start).

# ---- IDENTITY ----------------------------------------------------------------
PLATFORM="LXC"
HOST_OS="Ubuntu 24.04 LTS"
ISOLATION_TYPE="Container"

# ---- WORKLOAD SIZING (identical to every other platform in this comparison) --
CPU_CORES="0-3"
CPU_THREADS=4
MEM_LIMIT="16G"
ITERATIONS=10

# ---- NETWORK ------------------------------------------------------------------
REMOTE_IP="192.168.100.50"
IPERF_PORT=5201

# ---- STORAGE --------------------------------------------------------------
# LXD storage pool "default" uses the "dir" driver (plain directory tree on
# the host's ext4 root fs) -- confirmed via `lxc storage list` after `lxd init
# --auto`. No zfsutils-linux installed on this host, so LXD fell back to dir.
IO_DIR="${HOME}"
DISK_TYPE="dir"
PROVISIONING_TYPE="dir-on-ext4"

# ---- OPTIONAL: kernel-compile source ----------------------------------------
KERNEL_VERSION="6.8"
